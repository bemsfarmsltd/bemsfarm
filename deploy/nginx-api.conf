# /etc/nginx/sites-available/api.bemsfarms.com
# Reverse proxy to the Node/Express API (PM2-managed, listening on 127.0.0.1:5000).
#
# Setup:
#   sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/api.bemsfarms.com
#   sudo ln -s /etc/nginx/sites-available/api.bemsfarms.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.bemsfarms.com   # adds the HTTPS server block + redirect

server {
    listen 80;
    server_name api.bemsfarms.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Required for req.secure / cookie `secure` flag / req.ip to work
        # correctly behind this proxy — index.js already has
        # app.set("trust proxy", 1), which trusts these headers.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.io / any future websocket usage
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}