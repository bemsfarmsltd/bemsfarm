# /etc/nginx/sites-available/admin.bemsfarms.com
# Serves the built admin dashboard (Bems-Farms-Admin-Front-end/dist) as a static SPA.
#
# Setup:
#   cd Bems-Farms-Admin-Front-end && npm run build
#   sudo mkdir -p /var/www/bemsfarms-admin
#   sudo cp -r dist/* /var/www/bemsfarms-admin/
#   sudo cp deploy/nginx-admin.conf /etc/nginx/sites-available/admin.bemsfarms.com
#   sudo ln -s /etc/nginx/sites-available/admin.bemsfarms.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.bemsfarms.com
#
# IMPORTANT: this domain must also be added to the server's CORS allowlist
# (server/src/index.js) or set via the ADMIN_URL env var — see deploy checklist.

server {
    listen 80;
    server_name admin.bemsfarms.com;

    root /var/www/bemsfarms-admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}