# /etc/nginx/sites-available/bemsfarms.com
# Serves the built customer storefront (client/dist) as a static SPA.
#
# Setup:
#   cd client && npm run build
#   sudo mkdir -p /var/www/bemsfarms-client
#   sudo cp -r dist/* /var/www/bemsfarms-client/
#   sudo cp deploy/nginx-client.conf /etc/nginx/sites-available/bemsfarms.com
#   sudo ln -s /etc/nginx/sites-available/bemsfarms.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bemsfarms.com -d www.bemsfarms.com

server {
    listen 80;
    server_name bemsfarms.com www.bemsfarms.com;

    root /var/www/bemsfarms-client;
    index index.html;

    # React Router uses client-side routing — every path that isn't a real
    # file (e.g. /product/15, /orders) must fall back to index.html, or a
    # hard refresh / shared link on those routes 404s instead of loading the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed Vite build assets; never cache index.html itself
    # so a new deploy is picked up on next load instead of staying stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}